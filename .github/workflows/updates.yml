name: Prepare signed update feed
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag with both tested packages (v1.3.0)'
        required: true
permissions:
  contents: read
jobs:
  ota:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download tested packages and current domestic manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'){throw 'A semantic release tag is required.'}
          $version=$env:RELEASE_TAG.Substring(1)
          if($version -eq '1.4.15'){throw 'Initial 1.4.15 migration uses the reviewed bridge/final publication bundle. See docs/UPDATE_EVOLUTION.md.'}
          New-Item -ItemType Directory -Path ota | Out-Null
          gh release download $env:RELEASE_TAG --pattern 'Dustweave-*-win-x64.zip' --dir ota
          if($LASTEXITCODE -ne 0){throw 'Both tested release packages are required.'}
          try {
            $index=if([semver]$version -ge [semver]'1.4.15'){'updates-v3.json'}else{'updates.json'}
            Invoke-WebRequest ("https://bd2.madsam.work/updates/dustweave/v2/"+$index) -OutFile ota/previous.json
          } catch {
            if([int]$_.Exception.Response.StatusCode -ne 404 -or [semver]$version -ge [semver]'1.4.15'){throw}
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare differential packages from recent releases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path 'ota/previous.json'){
            $signed=Get-Content 'ota/previous.json' -Raw|ConvertFrom-Json
            $prior=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signed.Payload))|ConvertFrom-Json
            New-Item -ItemType Directory -Path ota/bases | Out-Null
            $recent=@($prior.Releases|Select-Object -First 10|ForEach-Object Version)
            $baselines=@($prior.Releases|Where-Object {$_.Version -in $recent -or [semver]$_.Version -ge [semver]'1.4.7'})
            if([semver]$env:RELEASE_TAG.Substring(1) -gt [semver]'1.4.15'){$baselines=@($prior.Releases|Where-Object {[semver]$_.Version -ge [semver]'1.4.15'}|Select-Object -First 10)}
            foreach($release in $baselines){
              if($release.Version -eq '1.3.0'){continue} # Withdrawn flat-layout release requires manual installation.
              if($release.Version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'){throw 'Invalid baseline version.'}
              gh release download ("v"+$release.Version) --pattern 'Dustweave-*-win-x64.zip' --dir ota/bases
              if($LASTEXITCODE -ne 0){throw 'Previous release packages could not be obtained.'}
            }
            Expand-Archive ("ota/Dustweave-"+$env:RELEASE_TAG.Substring(1)+"-Lite-win-x64.zip") ota/tool
            ./scripts/new-update-deltas.ps1 -Version $env:RELEASE_TAG.Substring(1) -PackageDirectory ota -BasePackageDirectory ota/bases -PreviousFeed ota/previous.json -Tool ota/tool/Dustweave.exe
          }

      - name: Sign the cumulative manifest
        shell: pwsh
        env:
          DUSTWEAVE_UPDATE_SIGNING_KEY: ${{ secrets.DUSTWEAVE_UPDATE_SIGNING_KEY }}
        run: |
          if(!$env:DUSTWEAVE_UPDATE_SIGNING_KEY){throw 'Configure the signing secret before running this workflow.'}
          $parameters=@{Version=$env:RELEASE_TAG.Substring(1);PackageDirectory='ota'}
          if(Test-Path 'ota/previous.json'){$parameters.PreviousFeed='ota/previous.json'}
          ./scripts/new-update-feed.ps1 @parameters
      - uses: actions/upload-artifact@v4
        with:
          name: signed-domestic-update
          path: |
            ota/updates.json
            ota/Dustweave-*-win-x64.zip
            ota/Dustweave-*-win-x64.delta.zip
            ota/delta-report.json
          retention-days: 14
# Publishing to the existing website remains a separate, explicitly authorized deployment.
# No public repository or release is created by this workflow.
