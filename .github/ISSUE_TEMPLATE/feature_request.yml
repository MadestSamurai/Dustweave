name: 功能建议 / Feature request
description: 说明你的使用场景和希望改善的结果 / Describe your use case and desired outcome
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么不便？ / What is difficult today?
      description: 请描述使用场景，而不仅是一个按钮名称 / Describe the use case, not just a proposed button
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到什么结果？ / Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法或参考 / Alternatives or references
      description: 可选；不要附私人账号信息 / Optional; do not include private account data
